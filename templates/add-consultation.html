<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<div class="container mt-3">

  <div class="mt-4 p-5 bg-primary text-white rounded">
    <h1>Doctors App</h1>
    <p>Add Consultation</p>
  </div>

  <div class="container mt-3">

    <h2>Add Consultation for {{patient_name}}</h2>

    <form action="/add-consultation-in-db" method="post">

      <div class="mb-3 mt-3">
        <label>Weight:</label>
        <input type="text" class="form-control" placeholder="Enter Weight" name="weight">
      </div>

      <div class="mb-3 mt-3">
        <label>Fever:</label>
        <input type="text" class="form-control" placeholder="Enter Fever" name="fever">
      </div>

      <div class="mb-3 mt-3">
        <label>BP High:</label>
        <input type="text" class="form-control" placeholder="Enter High BP" name="bphigh">
      </div>

      <div class="mb-3 mt-3">
        <label>BP Low:</label>
        <input type="text" class="form-control" placeholder="Enter Low BP" name="bplow">
      </div>

      <div class="mb-3 mt-3">
        <label>Sugar:</label>
        <input type="text" class="form-control" placeholder="Enter Sugar" name="sugar">
      </div>

      <div class="mb-3 mt-3">
        <label>Complaints:</label>
        <textarea class="form-control" placeholder="Enter Complaints" name="complaints"></textarea>
      </div>

      <div class="mb-3 mt-3">
        <label>Medicines:</label>
        <textarea class="form-control" placeholder="Enter Medicines" name="medicines"></textarea>
      </div>

      <div class="mb-3 mt-3">
        <label>Follow Up:</label>
        <input type="text" class="form-control" placeholder="Enter Follow Up" name="followup">
      </div>

      <button type="submit" class="btn btn-primary">Add Consultation</button>

    </form>

    <br>

    <a href="/home" class="btn btn-secondary">Home</a>

  </div>

</div>

</body>
</html>
