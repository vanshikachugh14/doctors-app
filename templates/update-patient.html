<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<div class="container mt-3">

  <div class="mt-4 p-5 bg-primary text-white rounded">
    <h1>Doctors App</h1>
    <p>Update Patient</p>
    <p>Welcome {{name}} | {{email}}</p>
  </div>

  <div class="container mt-3">
    <nav class="navbar navbar-expand-sm bg-light">
      <div class="container-fluid">
        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link" href="/home">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/add-patient">Add Patient</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/fetch-patients">View Patients</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/fetch-consultations">View Consultations</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/">Logout</a>
          </li>

        </ul>
      </div>
    </nav>
  </div>

  <h2 class="mt-4">Update Patient</h2>

  <form action="/update-patient-in-db" method="post">

    <div class="mb-3 mt-3">
      <label>Name:</label>
      <input type="text" class="form-control"
             name="name"
             value="{{patient['name']}}">
    </div>

    <div class="mb-3 mt-3">
      <label>Phone:</label>
      <input type="text" class="form-control"
             name="phone"
             value="{{patient['phone']}}">
    </div>

    <div class="mb-3 mt-3">
      <label>Email:</label>
      <input type="email" class="form-control"
             name="email"
             value="{{patient['email']}}">
    </div>

    <div class="mb-3 mt-3">
      <label>Address:</label>
      <input type="text" class="form-control"
             name="address"
             value="{{patient['address']}}">
    </div>

    <div class="mb-3 mt-3">
      <label>Gender:</label>
      <input type="text" class="form-control"
             name="gender"
             value="{{patient['gender']}}">
    </div>

    <div class="mb-3 mt-3">
      <label>Age:</label>
      <input type="number" class="form-control"
             name="age"
             value="{{patient['age']}}">
    </div>

    <button type="submit" class="btn btn-primary">
      Update Patient
    </button>

  </form>

  <br>

  <a href="/fetch-patients" class="btn btn-secondary">
    Back to Patients
  </a>

</div>

</body>
</html>
